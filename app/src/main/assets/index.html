<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKO SALAM</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#f5f5f5;color:#222}
    header{background:#0d6efd;color:white;padding:18px 15px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .header-content{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .logo{font-size:24px;font-weight:bold}
    .cart-button{background:white;color:#0d6efd;border:none;border-radius:20px;padding:9px 14px;font-weight:bold;cursor:pointer}
    .hero{background:white;text-align:center;padding:35px 15px}
    .hero h1{color:#0d6efd;margin-bottom:10px;font-size:32px}
    .hero p{color:#666}
    .search-box{max-width:700px;margin:20px auto;padding:0 15px}
    .search-box input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none}
    .container{max-width:1100px;margin:auto;padding:20px 15px 50px}
    .section-title{margin-bottom:20px;font-size:24px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
    .product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .product-image{height:180px;background:#e9ecef;display:flex;align-items:center;justify-content:center;font-size:60px}
    .product-info{padding:15px}
    .product-name{font-size:18px;font-weight:bold;margin-bottom:8px}
    .product-price{color:#0d6efd;font-weight:bold;font-size:18px;margin-bottom:12px}
    .add-button{width:100%;border:none;background:#0d6efd;color:white;padding:11px;border-radius:8px;cursor:pointer;font-weight:bold}
    .add-button:active{transform:scale(.98)}
    .cart-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200}
    .cart{position:absolute;right:0;top:0;height:100%;width:min(420px,92%);background:white;padding:20px;overflow-y:auto}
    .cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .close-button{border:none;background:#eee;border-radius:50%;width:35px;height:35px;cursor:pointer;font-size:18px}
    .cart-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}
    .cart-item-info{flex:1}.cart-item-name{font-weight:bold}.cart-item-price{color:#666;margin-top:4px}
    .quantity{display:flex;align-items:center;gap:7px;margin-top:7px}
    .quantity button{width:28px;height:28px;border:none;background:#0d6efd;color:white;border-radius:5px;cursor:pointer}
    .cart-total{font-size:20px;font-weight:bold;margin:20px 0}
    .checkout{width:100%;border:none;padding:14px;background:#198754;color:white;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
    .empty{text-align:center;color:#777;padding:30px 0}
    footer{background:#222;color:white;text-align:center;padding:25px 15px}
    @media(max-width:500px){.logo{font-size:20px}.hero h1{font-size:27px}.products{grid-template-columns:repeat(2,1fr);gap:12px}.product-image{height:140px;font-size:45px}.product-name{font-size:15px}.product-price{font-size:15px}}
  </style>
</head>
<body>
<header><div class="header-content"><div class="logo">🛍️ TOKO SALAM</div><button class="cart-button" onclick="openCart()">🛒 Keranjang (<span id="cartCount">0</span>)</button></div></header>
<section class="hero"><h1>Selamat Datang di TOKO SALAM</h1><p>Belanja mudah, cepat dan nyaman.</p><div class="search-box"><input type="text" id="searchInput" placeholder="🔎 Cari produk..." oninput="searchProducts()"></div></section>
<main class="container"><h2 class="section-title">Produk Kami</h2><div class="products" id="productList"></div></main>
<div class="cart-panel" id="cartPanel"><div class="cart"><div class="cart-header"><h2>🛒 Keranjang</h2><button class="close-button" onclick="closeCart()">✕</button></div><div id="cartItems"></div><div class="cart-total">Total: <span id="cartTotal">Rp0</span></div><button class="checkout" onclick="checkoutWhatsApp()">💬 Pesan via WhatsApp</button></div></div>
<footer><p><strong>TOKO SALAM</strong></p><p>Belanja mudah dan nyaman.</p><p>© 2026 TOKO SALAM</p></footer>
<script>
const products=[
{id:1,name:"Produk 1",price:25000,icon:"📱"},
{id:2,name:"Produk 2",price:35000,icon:"🎧"},
{id:3,name:"Produk 3",price:50000,icon:"⌚"},
{id:4,name:"Produk 4",price:75000,icon:"🎒"},
{id:5,name:"Produk 5",price:100000,icon:"👕"},
{id:6,name:"Produk 6",price:150000,icon:"👟"}];
let cart=[];
function formatRupiah(n){return "Rp"+n.toLocaleString("id-ID")}
function displayProducts(list=products){
 const el=document.getElementById("productList"); el.innerHTML="";
 if(!list.length){el.innerHTML="<p>Tidak ada produk ditemukan.</p>";return}
 list.forEach(p=>el.innerHTML+=`<div class="product"><div class="product-image">${p.icon}</div><div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">${formatRupiah(p.price)}</div><button class="add-button" onclick="addToCart(${p.id})">+ Tambah</button></div></div>`)
}
function addToCart(id){const p=products.find(x=>x.id===id),e=cart.find(x=>x.id===id);if(e)e.quantity++;else cart.push({...p,quantity:1});updateCart();alert(p.name+" ditambahkan ke keranjang.")}
function updateCart(){
 const items=document.getElementById("cartItems"),count=document.getElementById("cartCount"),totalEl=document.getElementById("cartTotal");
 items.innerHTML="";let total=0,countN=0;
 if(!cart.length)items.innerHTML='<div class="empty">Keranjang masih kosong.</div>';
 cart.forEach((it,i)=>{const sub=it.price*it.quantity;total+=sub;countN+=it.quantity;items.innerHTML+=`<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${it.icon} ${it.name}</div><div class="cart-item-price">${formatRupiah(it.price)}</div><div class="quantity"><button onclick="changeQuantity(${i},-1)">−</button><span>${it.quantity}</span><button onclick="changeQuantity(${i},1)">+</button><button onclick="removeFromCart(${i})" style="background:#dc3545">🗑</button></div></div><strong>${formatRupiah(sub)}</strong></div>`});
 count.textContent=countN;totalEl.textContent=formatRupiah(total)
}
function changeQuantity(i,c){cart[i].quantity+=c;if(cart[i].quantity<=0)cart.splice(i,1);updateCart()}
function removeFromCart(i){cart.splice(i,1);updateCart()}
function openCart(){document.getElementById("cartPanel").style.display="block";updateCart()}
function closeCart(){document.getElementById("cartPanel").style.display="none"}
function searchProducts(){const k=document.getElementById("searchInput").value.toLowerCase();displayProducts(products.filter(p=>p.name.toLowerCase().includes(k)))}
function checkoutWhatsApp(){
 if(!cart.length){alert("Keranjang masih kosong.");return}
 let msg="Halo TOKO SALAM, saya ingin memesan:%0A%0A",total=0;
 cart.forEach(it=>{const sub=it.price*it.quantity;total+=sub;msg+="• "+it.name+" x"+it.quantity+" = "+formatRupiah(sub)+"%0A"});
 msg+="%0ATotal: "+formatRupiah(total);
 const nomorWhatsApp="6281234567890";
 window.open("https://wa.me/"+nomorWhatsApp+"?text="+msg,"_blank")
}
displayProducts();updateCart();
</script>
</body>
</html>
