<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TOKO SALAM - PENJUAL</title>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

header {
    background: #075e54;
    color: white;
    padding: 16px;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 700px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0002;
}

input,
textarea,
button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

textarea {
    min-height: 90px;
}

button {
    border: none;
    background: #075e54;
    color: white;
    font-weight: bold;
}

button.danger {
    background: #c62828;
}

button.secondary {
    background: #555;
}

img.product-image {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 8px;
}

.hidden {
    display: none;
}

.product {
    border: 1px solid #ddd;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
}

.price {
    color: #075e54;
    font-size: 18px;
    font-weight: bold;
}

.status {
    padding: 10px;
    background: #eee;
    border-radius: 8px;
    margin-bottom: 10px;
}

</style>

</head>

<body>

<header>

<h2>TOKO SALAM</h2>
<div>PENJUAL / ADMIN</div>

</header>

<div class="container">

<!-- LOGIN -->

<div id="loginPanel" class="card">

<h3>Login Penjual</h3>

<input
    type="email"
    id="email"
    placeholder="Email Admin">

<input
    type="password"
    id="password"
    placeholder="Password">

<button onclick="login()">
    LOGIN
</button>

<div id="loginStatus"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel" class="hidden">

<div class="card">

<h3>Pengaturan Toko</h3>

<input
    type="text"
    id="whatsapp"
    placeholder="Nomor WhatsApp contoh 628123456789">

<button onclick="saveWhatsApp()">
    Simpan Nomor WhatsApp
</button>

<button
    class="secondary"
    onclick="logout()">
    LOGOUT
</button>

<div id="settingStatus"
     class="status">
</div>

</div>


<!-- PRODUK -->

<div class="card">

<h3 id="formTitle">
Tambah Produk
</h3>

<input
    type="hidden"
    id="editId">

<input
    type="text"
    id="nama"
    placeholder="Nama produk">

<input
    type="number"
    id="harga"
    placeholder="Harga">

<input
    type="number"
    id="stok"
    placeholder="Stok">

<textarea
    id="deskripsi"
    placeholder="Deskripsi produk">
</textarea>

<input
    type="file"
    id="foto"
    accept="image/*">

<button onclick="saveProduct()">
    SIMPAN PRODUK
</button>

<button
    class="secondary"
    onclick="resetForm()">
    BATAL / RESET
</button>

<div id="productStatus"
     class="status">
</div>

</div>


<div class="card">

<h3>Daftar Produk</h3>

<div id="productList">
Memuat produk...
</div>

</div>

</div>

</div>


<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyAuw2QucUzalTp56NvuCYamoIAJ-GjzQoU",

    authDomain:
        "toko-salam.firebaseapp.com",

    projectId:
        "toko-salam",

    storageBucket:
        "toko-salam.firebasestorage.app",

    messagingSenderId:
        "384903652728",

    appId:
        "1:384903652728:web:24fbb72753ac8f2eef148d",

    measurementId:
        "G-H40M5ZPE0Q"
};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database();

const produkRef =
    db.ref("produk");

const pengaturanRef =
    db.ref("pengaturan");


/* LOGIN */

function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        document.getElementById("loginStatus")
            .innerText =
            "Email dan password wajib diisi.";

        return;
    }

    auth.signInWithEmailAndPassword(
        email,
        password
    )
    .then(function() {

        document.getElementById("loginStatus")
            .innerText =
            "Login berhasil.";

    })
    .catch(function(error) {

        document.getElementById("loginStatus")
            .innerText =
            "Login gagal: " +
            error.message;
    });
}


/* STATUS LOGIN */

auth.onAuthStateChanged(function(user) {

    if (user) {

        document
            .getElementById("loginPanel")
            .classList.add("hidden");

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");

        loadSettings();

        loadProducts();

    } else {

        document
            .getElementById("loginPanel")
            .classList.remove("hidden");

        document
            .getElementById("adminPanel")
            .classList.add("hidden");
    }
});


/* LOGOUT */

function logout() {

    auth.signOut();
}


/* NOMOR WHATSAPP */

function loadSettings() {

    pengaturanRef.on(
        "value",
        function(snapshot) {

            const data =
                snapshot.val() || {};

            document
                .getElementById("whatsapp")
                .value =
                data.whatsapp || "";
        }
    );
}


function saveWhatsApp() {

    const number =
        document
        .getElementById("whatsapp")
        .value
        .replace(/\D/g, "");

    if (!number) {

        alert(
            "Masukkan nomor WhatsApp."
        );

        return;
    }

    pengaturanRef
        .update({
            whatsapp: number
        })
        .then(function() {

            document
                .getElementById("settingStatus")
                .innerText =
                "Nomor WhatsApp tersimpan.";

        })
        .catch(function(error) {

            document
                .getElementById("settingStatus")
                .innerText =
                error.message;
        });
}


/* FOTO */

function resizeImage(file) {

    return new Promise(function(resolve, reject) {

        const reader =
            new FileReader();

        reader.onload = function(event) {

            const img =
                new Image();

            img.onload = function() {

                const maxWidth = 800;

                let width = img.width;

                let height = img.height;

                if (width > maxWidth) {

                    height =
                        height *
                        maxWidth /
                        width;

                    width =
                        maxWidth;
                }

                const canvas =
                    document.createElement("canvas");

                canvas.width = width;

                canvas.height = height;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                const base64 =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.75
                    );

                resolve(base64);
            };

            img.onerror = reject;

            img.src =
                event.target.result;
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}


/* SIMPAN PRODUK */

async function saveProduct() {

    if (!auth.currentUser) {

        alert("Silakan login.");

        return;
    }

    const id =
        document
        .getElementById("editId")
        .value;

    const nama =
        document
        .getElementById("nama")
        .value
        .trim();

    const harga =
        Number(
            document
            .getElementById("harga")
            .value
        );

    const stok =
        Number(
            document
            .getElementById("stok")
            .value
        );

    const deskripsi =
        document
        .getElementById("deskripsi")
        .value
        .trim();

    const fotoInput =
        document
        .getElementById("foto");

    if (!nama) {

        alert("Nama produk wajib diisi.");

        return;
    }

    if (harga < 0 || stok < 0) {

        alert("Harga dan stok tidak boleh negatif.");

        return;
    }

    try {

        let foto = "";

        if (fotoInput.files.length > 0) {

            foto =
                await resizeImage(
                    fotoInput.files[0]
                );

        } else if (id) {

            const oldSnapshot =
                await produkRef
                .child(id)
                .once("value");

            const oldData =
                oldSnapshot.val();

            foto =
                oldData &&
                oldData.foto
                    ? oldData.foto
                    : "";
        }

        const data = {

            nama: nama,

            harga: harga,

            stok: stok,

            deskripsi: deskripsi,

            foto: foto,

            waktu:
                Date.now()
        };

        if (id) {

            await produkRef
                .child(id)
                .update(data);

            document
                .getElementById("productStatus")
                .innerText =
                "Produk berhasil diperbarui.";

        } else {

            await produkRef
                .push(data);

            document
                .getElementById("productStatus")
                .innerText =
                "Produk berhasil ditambahkan.";
        }

        resetForm();

    } catch (error) {

        document
            .getElementById("productStatus")
            .innerText =
            "Error: " +
            error.message;
    }
}


/* TAMPIL PRODUK */

function loadProducts() {

    produkRef.on(
        "value",
        function(snapshot) {

            const data =
                snapshot.val() || {};

            const list =
                document
                .getElementById("productList");

            list.innerHTML = "";

            const ids =
                Object.keys(data);

            if (ids.length === 0) {

                list.innerHTML =
                    "Belum ada produk.";

                return;
            }

            ids.forEach(function(id) {

                const p =
                    data[id];

                const div =
                    document.createElement("div");

                div.className =
                    "product";

                div.innerHTML = `

                    ${
                        p.foto
                        ?
                        `<img
                            class="product-image"
                            src="${p.foto}">
                        `
                        :
                        ""
                    }

                    <h3>
                        ${escapeHtml(p.nama || "")}
                    </h3>

                    <div class="price">
                        Rp ${Number(
                            p.harga || 0
                        ).toLocaleString("id-ID")}
                    </div>

                    <p>
                        Stok:
                        ${Number(p.stok || 0)}
                    </p>

                    <p>
                        ${escapeHtml(
                            p.deskripsi || ""
                        )}
                    </p>

                    <button
                        onclick="editProduct('${id}')">
                        EDIT
                    </button>

                    <button
                        class="danger"
                        onclick="deleteProduct('${id}')">
                        HAPUS
                    </button>
                `;

                list.appendChild(div);
            });
        }
    );
}


/* EDIT */

async function editProduct(id) {

    const snapshot =
        await produkRef
        .child(id)
        .once("value");

    const p =
        snapshot.val();

    if (!p) return;

    document
        .getElementById("editId")
        .value = id;

    document
        .getElementById("nama")
        .value =
        p.nama || "";

    document
        .getElementById("harga")
        .value =
        p.harga || 0;

    document
        .getElementById("stok")
        .value =
        p.stok || 0;

    document
        .getElementById("deskripsi")
        .value =
        p.deskripsi || "";

    document
        .getElementById("foto")
        .value = "";

    document
        .getElementById("formTitle")
        .innerText =
        "Edit Produk";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* HAPUS */

function deleteProduct(id) {

    if (!confirm(
        "Hapus produk ini?"
    )) {

        return;
    }

    produkRef
        .child(id)
        .remove()
        .then(function() {

            alert(
                "Produk berhasil dihapus."
            );

        })
        .catch(function(error) {

            alert(
                "Gagal menghapus: " +
                error.message
            );
        });
}


/* RESET */

function resetForm() {

    document
        .getElementById("editId")
        .value = "";

    document
        .getElementById("nama")
        .value = "";

    document
        .getElementById("harga")
        .value = "";

    document
        .getElementById("stok")
        .value = "";

    document
        .getElementById("deskripsi")
        .value = "";

    document
        .getElementById("foto")
        .value = "";

    document
        .getElementById("formTitle")
        .innerText =
        "Tambah Produk";
}


/* KEAMANAN TAMPILAN */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
